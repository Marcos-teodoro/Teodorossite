<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — TEODORA</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/css/admin.css">
  <script>window.TEODORA_API_BASE = window.TEODORA_API_BASE || (location.port === '3001' ? '' : 'http://localhost:3001');</script>
</head>
<body>
  <div id="loginScreen" class="login-wrap">
    <div class="login-box">
      <h1>TEODORA Admin</h1>
      <p style="color:var(--muted);font-size:0.9rem;margin:0 0 1.25rem;">Acesso restrito ao painel de postagens.</p>
      <form id="adminLogin" class="grid-form" style="grid-template-columns:1fr">
        <label>E-mail<input type="email" id="loginEmail" required></label>
        <label>Senha<input type="password" id="loginPassword" required></label>
        <button class="btn" type="submit">Entrar</button>
      </form>
      <p id="loginMsg" class="msg hidden"></p>
    </div>
  </div>

  <div id="appShell" class="layout hidden">
    <aside class="sidebar">
      <div class="brand">Teodora</div>
      <nav>
        <button data-view="dashboard" class="active">Dashboard</button>
        <button data-view="products">Produtos</button>
        <button data-view="categories">Categorias</button>
        <button data-view="orders">Pedidos</button>
      </nav>
      <div class="foot">
        <div id="adminName"></div>
        <button id="btnLogout" style="margin-top:0.5rem;padding:0.4rem 0;color:#a8a29e;">Sair</button>
        <div><a href="/" style="color:#a8a29e;">Ver loja</a></div>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div>
          <h1 id="viewTitle">Dashboard</h1>
          <p id="viewSubtitle">Visão geral da operação</p>
        </div>
        <button id="btnNewProduct" class="btn hidden">Novo produto</button>
      </div>

      <section id="view-dashboard"></section>
      <section id="view-products" class="hidden"></section>
      <section id="view-categories" class="hidden"></section>
      <section id="view-orders" class="hidden"></section>
      <section id="view-product-form" class="hidden"></section>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/admin/js/admin.js"></script>
</body>
</html>
